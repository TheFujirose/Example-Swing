<!DOCTYPE html>
<html lang="en">
<head>
  <title>Students</title>
  <th:block th:insert="fragments/layout.html :: headerfiles"></th:block>
</head>
<body>
  <header th:replace="fragments/layout.html :: header ('Student Home')"/>
  <main class="container mt-1 mb-1 tp-3">

    <!-- Quick Hero Section -->
    <section class="bg-dark text-light text-center" style="padding: 100px 0">
      <div class="container">
        <h4 class="display-4 fw-bold">Student Information</h4>
        <p>Various Students are recorded on our mySQL database</p>
        <a class="btn btn-primary" th:href="@{/students/add}">Add one today</a>
      </div>
    </section>

    <!-- A showing of all students -->
    <section id="student-list">
      <h5 class="mt-3 mb-2 text-center h5">Students</h5>
     <table th:replace="fragments/views.html :: view_students (${students})"/>
    </section>
  </main>
  <script th:replace="fragments/layout.html :: bootstrap"></script>
</body>
</html>
