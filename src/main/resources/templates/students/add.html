<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Register New Student</title>
  <th:block th:insert="fragments/layout.html :: headerfiles"></th:block>
</head>
<body>
  <header th:replace="fragments/layout.html :: header ('Student Home')"/>
  <main class="container mt-1 mb-1 tp-3">

    <section class="mt-3 mb-1" id="description">
        <h1>Student Registration</h1>
        <p>Add a new student to the database</p>
    </section>

    <section id="student-form">
      <div class="card">
        <form class="card-body" th:action="@{/students/add}" method="post" th:insert="fragments/forms.html :: student_form (${student})"/>
      </div>
    </section>
  </main>
  <script th:replace="fragments/layout.html :: bootstrap"></script>
</body>
</html>
