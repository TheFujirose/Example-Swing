<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Fragments</title>
    <!--
    Bunch of table views for the models.
    Note: Ignore the empty tag warnings -->
</head>
<body>

    <table class="table" th:fragment="view_courses (courses)">
        <tr>
            <th scope="col">#</th>
            <th scope="col">Title</th>
            <th scope="col">Instructor</th>
            <!-- This column for edit buttons -->
            <th scope="col"></th>
        </tr>
        <tr th:each="course : ${courses}">
            <th scope="row" th:text="*{course.id}"/>
            <td th:text="*{course.title}"/>
            <td th:text="*{course.instructor}"/>
            <td>
                <a class="btn btn-secondary" th:href="@{'course/edit/' + ${course.id}}">Edit</a>
                <a class="btn btn-danger" th:href="@{'course/delete/' + ${course.id}}">Delete</a>
            </td>
        </tr>
    </table>

    <table class="table" th:fragment="view_students (students)">
        <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Course</th>
            <th scope="col">Level of Study</th>
            <!-- This column for edit buttons -->
            <th scope="col"></th>
        </tr>
        <tr th:each="student: ${students}">
            <th scope="row" th:text="${student.id}"/>
            <td th:text="${student.name}"/>
            <td th:text="${student.email}"/>
            <td th:text="${student.course}"/>
            <td th:text="${student.level}"/>
            <td>
                <a class="btn btn-secondary" th:href="@{'/students/edit/' + ${student.id}}">Edit</a>
                <a class="btn btn-danger" th:href="@{'/students/delete/' + ${student.id}}">Delete</a>
            </td>
        </tr>
    </table>
</body>
</html>
